<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用户记忆</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </span>
      用户记忆 <small id="ver"></small>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" placeholder="搜索 user_id / 事实 / 事件内容…" />
    </div>
    <div class="chips" id="chips">
      <div class="chip on" data-f="all">全部</div>
      <div class="chip" data-f="cold">有冷层</div>
      <div class="chip" data-f="protected">受保护</div>
    </div>
    <div class="spacer"></div>
    <div class="icon-btn" id="theme" title="切换主题（浅/深/跟随系统）">🌙</div>
    <div class="icon-btn" id="refresh" title="刷新">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </div>
    <div class="icon-btn" id="settings" title="设置">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.9H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.1z"/></svg>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-head"><h2>用户</h2><span class="badge" id="ucount">-</span></div>
      <div class="scroll" id="users"></div>
    </aside>
    <section class="panel">
      <div class="detail-scroll" id="detail"><div class="empty">从左侧选择一个用户</div></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="panel-head"><h2>设置</h2><div class="icon-btn" id="closeDrawer" style="color:var(--muted);background:var(--panel-2);border-color:var(--border)">✕</div></div>
  <div class="scroll">
    <div class="field"><label>嵌入模型</label><select id="sel-emb"></select></div>
    <div class="field"><label>重排模型</label><select id="sel-rr"></select></div>
    <button class="btn primary" id="save-prov" style="width:100%">保存模型设置</button>

    <h3 class="drawer-h">备份与迁移</h3>
    <button class="btn" id="exp" style="width:100%">导出记忆（JSON）</button>
    <div style="height:8px"></div>
    <label class="btn" style="display:block;text-align:center">导入记忆（JSON）<input id="imp" type="file" accept=".json,application/json" style="display:none" /></label>

    <h3 class="drawer-h">危险操作</h3>
    <div class="danger-zone">
      <h4>重建数据库</h4>
      <p>会清空当前库并新建空库；旧库改名 <code>memory.db.bak.&lt;时间戳&gt;</code>。建议先导出。</p>
      <button class="btn danger" id="rebuild" style="width:100%">重建数据库</button>
    </div>
  </div>
</aside>

<div class="modal-scrim" id="modalScrim">
  <div class="modal">
    <h3 id="mTitle">确认</h3>
    <p id="mText">确定吗？</p>
    <div class="row">
      <button class="btn" id="mNo">取消</button>
      <button class="btn danger" id="mYes">确认</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
