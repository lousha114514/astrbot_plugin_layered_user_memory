<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户记忆</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>用户记忆</h1>
      <div class="actions">
        <input id="search" type="text" placeholder="按 user_id 过滤" />
        <button id="refresh">刷新</button>
      </div>
    </header>
    <main>
      <section class="col users">
        <h2>用户</h2>
        <ul id="users"></ul>
      </section>
      <section class="col detail">
        <h2>详情</h2>
        <div id="detail" class="muted">从左侧选择一个用户</div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
